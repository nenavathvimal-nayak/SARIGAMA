<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="bannerWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="30%" stop-color="#3B82F6" />
      <stop offset="65%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="380" fill="url(#bannerBg)" />

  <!-- Harmonic Grid / Acoustics Matrix -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
  </g>

  <!-- Ambient Soundwave Curves (Background) -->
  <path d="M 0 260 C 300 120, 600 360, 900 180 C 1050 90, 1150 140, 1200 160" fill="none" stroke="url(#bannerWaveGrad)" stroke-width="3" opacity="0.3" />
  <path d="M 0 290 C 250 380, 550 140, 850 280 C 1020 360, 1120 230, 1200 240" fill="none" stroke="url(#bannerWaveGrad)" stroke-width="2" opacity="0.2" />

  <!-- Center-Left: Main Visual Emblem -->
  <g transform="translate(80, 65)">
    <!-- Squircle Container -->
    <rect width="130" height="130" rx="36" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <circle cx="65" cy="65" r="48" fill="none" stroke="#6366F1" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 5" />
    
    <!-- Fluid Musical 'S' Glyph -->
    <path d="M 92 42 
             C 80 30, 48 28, 42 48 
             C 36 66, 92 68, 86 88 
             C 80 108, 48 110, 38 96"
          fill="none"
          stroke="url(#bannerWaveGrad)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#bannerGlow)" />

    <path d="M 90 44 
             C 80 34, 52 33, 47 48 
             C 43 62, 87 66, 82 84 
             C 78 98, 52 102, 43 93"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.9" />

    <circle cx="92" cy="42" r="5" fill="#06B6D4" />
    <circle cx="38" cy="96" r="5" fill="#EC4899" />
  </g>

  <!-- Typography: Product Title -->
  <text x="245" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="6" fill="#FFFFFF">
    SARIGAMA
  </text>

  <!-- Version & Architecture Badge -->
  <g transform="translate(680, 85)">
    <rect width="180" height="28" rx="14" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2" />
    <text x="90" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#C7D2FE" text-anchor="middle" letter-spacing="1">
      AI CREATION STUDIO
    </text>
  </g>

  <!-- Tagline -->
  <text x="248" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
    AI-Powered Music Creation Studio
  </text>

  <!-- Secondary Descriptive Line -->
  <text x="248" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#64748B">
    Full song composition, lyric conditioning, style synthesis, and audio stem isolation on consumer GPUs.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 260)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="42" rx="21" fill="url(#pillBg)" stroke="#334155" stroke-width="1" />
      <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        ⚡ Fast (Sub-2s A100)
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(175, 0)">
      <rect width="165" height="42" rx="21" fill="url(#pillBg)" stroke="#334155" stroke-width="1" />
      <text x="82" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        🎛️ Under 4GB VRAM
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(355, 0)">
      <rect width="170" height="42" rx="21" fill="url(#pillBg)" stroke="#334155" stroke-width="1" />
      <text x="85" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        🎙️ 50+ Languages
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(540, 0)">
      <rect width="175" height="42" rx="21" fill="url(#pillBg)" stroke="#334155" stroke-width="1" />
      <text x="87" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        🎻 Stems & Repainting
      </text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(730, 0)">
      <rect width="155" height="42" rx="21" fill="url(#pillBg)" stroke="#334155" stroke-width="1" />
      <text x="77" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        🎸 1-Click LoRA
      </text>
    </g>

    <!-- Pill 6 -->
    <g transform="translate(900, 0)">
      <rect width="140" height="42" rx="21" fill="url(#pillBg)" stroke="#334155" stroke-width="1" />
      <text x="70" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">
        🌐 Open Source
      </text>
    </g>
  </g>
</svg>
