<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="logoWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="26" fill="url(#logoBgGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="50" cy="50" r="38" fill="none" stroke="#6366F1" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 4" />
    
    <!-- Stylized D + Wave -->
    <path d="M 36 28 
             L 36 74 
             M 36 30
             C 66 30, 76 42, 76 51
             C 76 60, 66 72, 36 72"
          fill="none"
          stroke="url(#logoWaveGrad)"
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#logoGlow)" />

    <path d="M 36 30 
             L 36 72
             M 36 32
             C 62 32, 71 42, 71 51
             C 71 60, 62 70, 36 70"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.85" />
    
    <circle cx="36" cy="28" r="4" fill="#38BDF8" />
    <circle cx="36" cy="74" r="4" fill="#F43F5E" />
  </g>

  <!-- Typography -->
  <!-- Product Brand Name -->
  <text x="135" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="url(#textGrad)">
    DHAVLO MI
  </text>

  <!-- Tagline / Subtitle -->
  <text x="137" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#818CF8">
    DHAAVLO MUSICAL INTELLIGENCE
  </text>

  <!-- Dot separator & descriptor -->
  <text x="390" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748B">
    • AI Music Platform
  </text>
</svg>
